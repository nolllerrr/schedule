[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-telegram-bot"
version = "1.1.1"
description = "Telegram bot for the PTGH class schedule"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "aiohttp-socks>=0.10,<1",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "Pillow>=12,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.17,<1",
    "uv==0.12.7",
]

[project.scripts]
schedule-bot = "schedule_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
schedule_bot = ["assets/fonts/*"]
schedule_grok = ["config.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
