name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow on main. No deployment was started."
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r build-requirements.lock -r dev-requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify dependency exports
        run: python scripts/update_locks.py --check
      - name: Check Python errors
        run: python -m ruff check --select F src tests scripts
      - name: Test
        run: python -m pytest --basetemp=.pytest-tmp-deploy
      - name: Build release image
        run: |
          docker build --target core --tag schedule-bot:core-deploy-check .
          docker run --rm --network none --entrypoint python schedule-bot:core-deploy-check -c "import shutil; from schedule_bot.config import Settings; from schedule_bot.bot.app import run_bot; assert shutil.which('grok') is None; assert not Settings.from_env(require_bot_token=False).grok_reactions_enabled"
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag schedule-bot:deploy-check .
      - name: Smoke-check release image offline
        run: |
          docker run --rm --network none --entrypoint grok schedule-bot:deploy-check --no-auto-update --version
          docker run --rm --network none --entrypoint python schedule-bot:deploy-check -c "from schedule_bot.repository import ScheduleRepository; from schedule_grok import load_config; from tempfile import TemporaryDirectory; from pathlib import Path; assert load_config().max_reaction_chars > 0; assert Path.home().joinpath('.grok').is_dir(); d=TemporaryDirectory(); r=ScheduleRepository(Path(d.name)/'check.db'); r.initialize(); print(r.current_schema_version())"

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install SSH key
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          key = Path(os.environ["RUNNER_TEMP"]) / "schedule-deploy-key"
          key.write_text(
              os.environ["PRODUCTION_SSH_PRIVATE_KEY"].strip() + "\n",
              encoding="utf-8",
          )
          key.chmod(0o600)
          PY
          ssh-keygen -y -f "$RUNNER_TEMP/schedule-deploy-key" > /dev/null
      - name: Configure verified SSH host key
        env:
          PRODUCTION_KNOWN_HOSTS: ${{ vars.PRODUCTION_KNOWN_HOSTS }}
        run: |
          test -n "$PRODUCTION_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Diagnose SSH connection
        env:
          PRODUCTION_SERVER: ${{ vars.PRODUCTION_SERVER }}
          PRODUCTION_PORT: ${{ vars.PRODUCTION_PORT }}
        run: |
          KEY="$RUNNER_TEMP/schedule-deploy-key"

          echo "=== Private key validation ==="
          ssh-keygen -y -f "$KEY" | ssh-keygen -lf -

          echo "=== SSH connection test ==="
          ssh -vv \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$KEY" \
            -p "$PRODUCTION_PORT" \
            "$PRODUCTION_SERVER" "echo SSH_OK"
          
      - name: Deploy selected commit
        env:
          PRODUCTION_SERVER: ${{ vars.PRODUCTION_SERVER }}
          PRODUCTION_PORT: ${{ vars.PRODUCTION_PORT }}
          PRODUCTION_REMOTE_DIR: ${{ vars.PRODUCTION_REMOTE_DIR }}
          PRODUCTION_COMPOSE_PROJECT: ${{ vars.PRODUCTION_COMPOSE_PROJECT }}
        run: |
          export DEPLOY_CONFIG="$RUNNER_TEMP/schedule-deploy.json"
          export DEPLOY_KEY_PATH="$RUNNER_TEMP/schedule-deploy-key"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "server": os.environ["PRODUCTION_SERVER"],
              "port": int(os.environ.get("PRODUCTION_PORT") or "22"),
              "remoteDir": os.environ["PRODUCTION_REMOTE_DIR"],
              "keyPath": os.environ["DEPLOY_KEY_PATH"],
              "project": os.environ.get("PRODUCTION_COMPOSE_PROJECT") or "schedule-bot",
          }
          Path(os.environ["DEPLOY_CONFIG"]).write_text(
              json.dumps(config), encoding="utf-8",
          )
          PY
          python scripts/release_tools.py deploy --repo "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" --config "$DEPLOY_CONFIG"
