name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r build-requirements.lock -r dev-requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify dependency exports
        run: python scripts/update_locks.py --check
      - name: Check Python errors
        run: python -m ruff check --select F src tests scripts
      - name: Test
        run: python -m pytest --basetemp=.pytest-tmp-ci
      - name: Build immutable release image
        run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag schedule-bot:ci .
      - name: Offline image smoke check
        run: |
          docker run --rm --network none --entrypoint grok schedule-bot:ci --no-auto-update --version
          docker run --rm --network none --entrypoint python schedule-bot:ci -c "from schedule_bot.repository import ScheduleRepository; from schedule_grok import load_config; from tempfile import TemporaryDirectory; from pathlib import Path; assert load_config().max_reaction_chars > 0; assert Path.home().joinpath('.grok').is_dir(); d=TemporaryDirectory(); r=ScheduleRepository(Path(d.name)/'check.db'); r.initialize(); print(r.current_schema_version())"
