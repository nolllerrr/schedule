services:
  bot:
    build: .
    image: ${SCHEDULE_BOT_IMAGE:-schedule-bot:local}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - grok-state:/home/bot/.grok
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "schedule-bot", "health", "--json"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  grok-state:
